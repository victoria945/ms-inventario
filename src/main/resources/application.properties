spring.application.name=ms_inventario
server.port=${SERVER_PORT:8082}

# Database Configuration (H2 en memoria por defecto, MySQL vía variables de entorno)
spring.datasource.url=${DB_URL:jdbc:h2:mem:inventariodb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# FLYWAY
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# JWT Configuration (clave compartida con ms-auth, provista por variable de entorno)
jwt.secret=${JWT_SECRET}

# LOGS
logging.level.root=INFO
logging.level.org.gestionpastelera=DEBUG
logging.file.name=logs/ms-inventario.log
